[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pawl-net"
version = "0.1.0"
description = "Physics-aware spatial inpainting for cloud-obscured land surface temperature"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3,<3",
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "opencv-python>=4.8,<5",
  "perlin-noise>=1.12,<2",
  "scikit-image>=0.21,<1",
  "scikit-learn>=1.3,<2",
  "joblib>=1.3,<2",
  "tqdm>=4.65,<5",
]

[project.urls]
Repository = "https://github.com/lnghuy2301/PAWL-Net-research"
Issues = "https://github.com/lnghuy2301/PAWL-Net-research/issues"

[project.optional-dependencies]
swin = ["timm>=1.0,<2", "torchvision>=0.18,<1"]
notebooks = ["jupyterlab>=4,<5", "matplotlib>=3.7,<4"]
gee = ["earthengine-api>=0.1", "geemap>=0.30"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "nbformat>=5,<6"]

[project.scripts]
pawl-train = "pawl_net.train:main"
pawl-evaluate = "pawl_net.evaluate:main"
pawl-rf = "pawl_net.baselines:main"
pawl-prepare = "pawl_net.preprocessing:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".local", ".tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
