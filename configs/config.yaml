# Paths resolve from project_root, which resolves relative to this YAML file.
project_root: ..
paths:
  train_patch_dir: data/patches/train
  test_patch_dir: data/patches/test
  ckpt_dir: outputs/checkpoints
  log_dir: outputs/logs

training:
  batch_size: 32
  lr: 0.0002
  loss_lr: 0.001
  weight_decay: 0.0001
  epochs: 50
  patience: 10
  device: auto
  num_workers: 0  # Portable Windows default; tune on the training machine.
  seed: 42
  amp: true
  loss_region: full  # Original code; manuscript describes cloud-only loss.
  charbonnier_eps: 0.000001

model:
  img_size: 128
  pretrained: true  # Swin training only. Evaluation does not download weights.

data:
  train_fraction: 0.8
  mask_strategy: random
  cloud_fraction: null  # Original masks have no enforced coverage interval.

random_forest:
  sample_rate: 0.03  # Original code; manuscript reports 0.07.
  n_features: 10  # Original code; manuscript reports nine features.
  n_estimators: 100
  max_depth: 20
  n_jobs: -1
